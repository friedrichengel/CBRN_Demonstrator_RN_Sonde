; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:sonde]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
; Port-Filter: verhindert, dass PlatformIO /dev/cu.Bluetooth-Incoming-Port autodetektiert
upload_port = /dev/cu.usb*
monitor_port = /dev/cu.usb*

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; OTA-faehige Partitionierung (2x App-Slot) fuer Firmware-Update ueber WLAN-Portal
board_build.partitions = partitions_ota.csv

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_MODE_OCT
  ; Task-Watchdog auf 15s (Default 5s war zu knapp wenn nimble_host CPU0 belegt)
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=15
  ; NimBLE - Extended Advertising / Coded PHY scan aktivieren
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
  ; Nur Observer-Rolle (passiver Scan, Manufacturer-Data) - spart Heap
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1

lib_deps =
  https://github.com/moononournation/Arduino_GFX.git
  h2zero/NimBLE-Arduino@^2.1.0